---

- name: "Create admin group {{ groupname }}"
  ansible.builtin.group:
    name: "{{ groupname }}"
    state: present
  when: groupname is defined

- name: "Create additional groups {{ user_groups }}"
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ user_groups }}"
  when: user_groups is defined and groupname is defined

- name: "Put user in admin group {{ groupname }}"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ groupname }}"
    append: true
  with_items: "{{ users }}"
  when: groupname is defined

- name: "Put user in additional groups {{ user_groups }}"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ user_groups + [groupname] }}"
    append: "{{ user_groups_append }}"
  with_items: "{{ users }}"
  when: user_groups is defined and groupname is defined
