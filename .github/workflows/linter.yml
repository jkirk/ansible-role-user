---
name: Lint Code Base

# Documentation:
#
# * https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# * https://github.com/super-linter/super-linter/tree/v9.0.0#get-started

# Run this workflow every time a new commit pushed to the repository
# and on a pull request against master
on: # yamllint disable-line rule:truthy
  push: null
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854  # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ansible file location for ansible-lint
          ANSIBLE_DIRECTORY: .
          # Workaround for Error: File:[/github/workspace/files/ansible_facts.d/services.fact] is not executable
          VALIDATE_BASH_EXEC: false
          # Workaround for ansible_facts.d/services.fact
          VALIDATE_SHELL_SHFMT: false
          # Workaround for molecule/base_ntp_ntpsigndsocket/files/chrony.buster.example.conf, templates/needrestart/synpro.conf.j2
          VALIDATE_SPELL_CODESPELL: false
          # Workaround for Code style issues found in 9 files (unclear what the problem is)
          VALIDATE_YAML_PRETTIER: false
