---
name: Ansible Molecule Workflow

# Run this workflow every time a new commit pushed to the repository
# and on a pull request against master and main
# and once week (Thursday)
on:
  push:
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "42 3 * * 4"

permissions: {}


jobs:
  molecule:
    name: Ansible Molecule
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        control: [bookworm, trixie, podman]
        include:
          - control: bookworm
            python_version: "3.11.2"
            ansible_core: "2.14.18"
          - control: trixie
            python_version: "3.13.5"
            ansible_core: "2.19.4"
          - control: podman
            python_version: "3.11.2"
            ansible_core: "2.14.18"
        target_distro:
          - debian11
          - debian12
          - debian13

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip" # caching pip dependencies

      - name: Install ansible-core and Ansible Molecule
        run: pip install ansible-core==${{ matrix.ansible_core }} molecule molecule-plugins[podman]

      - name: Check ansible version
        run: ansible --version

      - name: Check molecule version
        run: molecule --version

      - name: Create ansible.cfg with correct roles_path
        run: printf '[defaults]\nroles_path=../' >ansible.cfg

      - name: Run molecule test
        run: molecule test --all
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.target_distro }}
