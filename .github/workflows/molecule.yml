# Ansible Molecule workflow is triggered on push

name: Ansible Molecule Workflow

# Run this workflow every time a new commit pushed to the repository
# and on a pull request against master
on:
  push:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  molecule:
    # Name the Job
    name: Ansible Molecule
    # Set the agent to run on
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        control: [bookworm, trixie, podman]
        include:
          - control: bookworm
            python_version: '3.11.2'
            ansible_core: "2.14.18"
          - control: trixie
            python_version: '3.13.3'
            ansible_core: "2.19.4"
          - control: podman
            python_version: '3.11.2'
            ansible_core: "2.14.18"
        target_distro:
          - debian11
          - debian12
          - debian13


    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Set up Python3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip" # caching pip dependencies

      - name: Install ansible-core and Ansible Molecule
        run: pip install ansible-core==${{ matrix.ansible_core }} molecule molecule-plugins[podman]

      - name: Check ansible version
        run: ansible --version

      - name: Check molecule version
        run: molecule --version

      - name: Create ansible.cfg with correct roles_path
        run: printf '[defaults]\nroles_path=../' >ansible.cfg

      - name: Run molecule test
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.target_distro }}
